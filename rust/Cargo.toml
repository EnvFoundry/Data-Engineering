[package]
name = "ai-data-reader"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Indexed, rank-aware streaming of AI Data Engineering shards"
license = "MIT"
repository = "https://github.com/EnvFoundry/Data-Engineering"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ai-data-read"
path = "src/main.rs"
