name: Data environment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python examples/pack_training.py
      - run: python -m build
      - run: python scripts/package_plugin.py
      - run: python scripts/check_distribution.py
  native-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --manifest-path rust/Cargo.toml
      - run: cargo +stable build --release --locked --manifest-path rust/Cargo.toml
      - run: python rust/compare_python.py

  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -e .
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk/typescript
      - run: npm test
        working-directory: sdk/typescript
      - run: npm pack --dry-run
        working-directory: sdk/typescript
